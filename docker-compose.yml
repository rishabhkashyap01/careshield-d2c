services:
  postgres:
    image: postgres:16-alpine
    container_name: careshield-postgres
    restart: unless-stopped
    environment:
      POSTGRES_USER: careshield
      POSTGRES_PASSWORD: careshield
      POSTGRES_DB: careshield
    ports:
      - "5432:5432"
    volumes:
      - pgdata:/var/lib/postgresql/data

volumes:
  pgdata:
